name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to validate
        type: string
        required: true
      release-tag:
        description: Expected v-prefixed version
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: subux-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: macos-15
            platform: darwin-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check release identity
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "v$(cat version.txt)" = "$RELEASE_TAG"
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5.3.0
          opam-pin: false
      - name: Install Dune
        run: opam install dune.3.17.2 --yes
      - name: Build
        run: opam exec -- dune build
      - name: Run regressions
        run: opam exec -- dune runtest
      - name: Check repository content
        run: opam exec -- dune exec subux -- check
      - name: Check package input rejection
        run: bash .github/scripts/test-package.sh
      - name: Check release recovery validation
        run: bash .github/scripts/test-recovery.sh
      - name: Package and smoke test outside the checkout
        run: bash .github/scripts/package.sh "$RUNNER_TEMP/packages"
      - name: Upload tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subux-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14

  npm-package:
    name: Assemble and test npm package
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Download tested packages from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: subux-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Check npm package input rejection
        run: bash .github/scripts/test-npm-package.sh
      - name: Assemble and smoke test as installed
        run: bash .github/scripts/npm-package.sh "$RUNNER_TEMP/packages" "$RUNNER_TEMP/npm"
      - name: Upload tested npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subux-npm
          path: ${{ runner.temp }}/npm/*
          if-no-files-found: error
          retention-days: 14
